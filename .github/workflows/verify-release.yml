name: Verify release

# Downloads each published archive, checks it against release/<tag>/SHA256SUMS,
# installs it from the file and compares its MCP tools with release/<tag>/tools.txt.
# Read-only: it changes no release, file or setting.

on:
  release:
    types: [published]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
      - name: Download, check and smoke-test each release
        shell: bash
        env:
          # Named so that only the download command receives it.
          RELEASE_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for dir in release/*/; do
            dir=${dir%/}
            tag=$(basename "$dir")
            version=$(jq -r .package.version "$dir/receipt.json")
            archive=$(jq -r .artifact.filename "$dir/receipt.json")
            work="$RUNNER_TEMP/$tag"
            mkdir -p "$work"
            GH_TOKEN="$RELEASE_READ_TOKEN" gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$work" --pattern "$archive"
            (cd "$work" && sha256sum --check --strict "$GITHUB_WORKSPACE/$dir/SHA256SUMS")
            (cd "$work" && npm init -y >/dev/null && npm install --no-audit --no-fund --ignore-scripts "./$archive")
            node scripts/smoke.mjs "$work/node_modules/.bin/agenttool-collab-mcp" "$work/journal.sqlite" "$version" "$dir/tools.txt"
          done
